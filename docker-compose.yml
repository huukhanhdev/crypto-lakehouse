# Crypto Streaming Lakehouse
# Profiles (PROJECT_SPEC §8):
#   (default)   source + CDC  — postgres, redpanda, connect, ingestor, console
#   lake        MinIO, catalog, Spark, Bronze/Silver   (Phase 1)
#   bi          Superset                                (Phase 3)
#   orchestrate Dagster                                 (Phase 3)
# Services with no `profiles:` key are the default set and always start.

name: crypto-lakehouse

services:
  # --- OLTP source of truth --------------------------------------------------
  postgres:
    image: postgres:16
    container_name: crypto-postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"          # required for Debezium logical replication
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Kafka-compatible log/broker (no ZooKeeper) ----------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: crypto-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # external kafka listener for host tools (rpk, etc.)
      - "9644:9644"     # admin api
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Debezium (Kafka Connect) ---------------------------------------------
  connect:
    image: quay.io/debezium/connect:2.7
    container_name: crypto-connect
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: crypto-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- Binance websocket ingestor (replaces the esports generator) -----------
  ingestor:
    build: ./ingestor
    container_name: crypto-ingestor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: crypto
      PGUSER: crypto
      PGPASSWORD: crypto
      SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT"
      TRACKED_DEPTH: "20"
      # DEMO_FLIP_SECS: "300"   # uncomment to force periodic SCD2 status flips
    restart: unless-stopped

  # --- Redpanda Console: browse topics/messages (demo aid) -------------------
  console:
    image: redpandadata/console:v2.7.2
    container_name: crypto-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONNECT_ENABLED: "true"
      CONNECT_CLUSTERS_NAME: crypto-connect
      CONNECT_CLUSTERS_URL: http://connect:8083

volumes:
  pgdata:
  redpanda:
