# Crypto Streaming Lakehouse
# Profiles (PROJECT_SPEC §8):
#   (default)   source + CDC  — postgres, redpanda, connect, ingestor, console
#   lake        MinIO, catalog, Spark, Bronze/Silver   (Phase 1)
#   bi          Superset                                (Phase 3)
#   orchestrate Dagster                                 (Phase 3)
# Services with no `profiles:` key are the default set and always start.

name: crypto-lakehouse

services:
  # --- OLTP source of truth --------------------------------------------------
  postgres:
    image: postgres:16
    container_name: crypto-postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"          # required for Debezium logical replication
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    environment:
      POSTGRES_DB: crypto
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Kafka-compatible log/broker (no ZooKeeper) ----------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: crypto-redpanda
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=info
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --memory=1200M          # cap Redpanda's arena (it OOM-killed the VM before)
      - --reserve-memory=0M
    mem_limit: 1600m
    ports:
      - "19092:19092"   # external kafka listener for host tools (rpk, etc.)
      - "9644:9644"     # admin api
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Debezium (Kafka Connect) ---------------------------------------------
  connect:
    image: quay.io/debezium/connect:2.7
    container_name: crypto-connect
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: crypto-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KAFKA_HEAP_OPTS: "-Xmx768M -Xms256M"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- Binance websocket ingestor (replaces the esports generator) -----------
  ingestor:
    build: ./ingestor
    container_name: crypto-ingestor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: crypto
      PGUSER: crypto
      PGPASSWORD: crypto
      SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT"
      TRACKED_DEPTH: "20"
      # DEMO_FLIP_SECS: "300"   # uncomment to force periodic SCD2 status flips
    restart: unless-stopped

  # --- Redpanda Console: browse topics/messages (demo aid) -------------------
  console:
    image: redpandadata/console:v2.7.2
    container_name: crypto-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      CONNECT_ENABLED: "true"
      CONNECT_CLUSTERS_NAME: crypto-connect
      CONNECT_CLUSTERS_URL: http://connect:8083

  # ==========================================================================
  # Profile: lake  (Phase 1) — object store, catalog, Spark Bronze/Silver
  # ==========================================================================

  # --- MinIO: S3-compatible object store -------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: crypto-minio
    profiles: ["lake"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- one-shot: create the warehouse bucket ---------------------------------
  mc:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: crypto-mc
    profiles: ["lake"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/warehouse &&
      echo 'warehouse bucket ready';
      "
    restart: "no"

  # --- Iceberg REST catalog (backed by sqlite; data in MinIO) ----------------
  rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: crypto-rest
    profiles: ["lake"]
    user: root                     # write the sqlite catalog on the mounted volume
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8181:8181"
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # WAL + busy_timeout so concurrent Bronze/Silver commits wait for the
      # single-writer lock instead of failing with SQLITE_BUSY (HTTP 500).
      CATALOG_URI: jdbc:sqlite:/rest/catalog.db?journal_mode=WAL&busy_timeout=30000
    volumes:
      - rest:/rest
    healthcheck:
      # rest image has only bash/java (no curl) — probe the port via /dev/tcp
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8181' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # --- Spark (local mode): runs Bronze + Silver streaming jobs ----------------
  spark:
    image: tabulario/spark-iceberg:3.5.5_1.8.1
    container_name: crypto-spark
    profiles: ["lake"]
    depends_on:
      redpanda:
        condition: service_healthy
      rest:
        condition: service_healthy
      mc:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      KAFKA_BOOTSTRAP: redpanda:9092
      # "earliest" (default) backfills the whole CDC log; "latest" ingests only
      # live data — used to smoke-test without replaying millions of old events.
      STARTING_OFFSETS: ${STARTING_OFFSETS:-earliest}
    mem_limit: 3500m
    volumes:
      - ./spark/jobs:/app/jobs:ro
      - ivy:/root/.ivy2          # cache downloaded packages across restarts
      - checkpoints:/app/checkpoints   # streaming checkpoints survive restarts
    # bypass the image's demo entrypoint (notebook/thrift) — just run our job
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command: >
      --master local[3]
      --driver-memory 2500m
      --conf spark.jars.packages=org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      /app/jobs/main.py
    restart: unless-stopped

volumes:
  pgdata:
  redpanda:
  minio:
  rest:
  ivy:
  checkpoints:
