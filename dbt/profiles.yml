# dbt connects to the Trino coordinator (service name `trino` on the compose net).
# No auth: Trino runs open on the laptop. `catalog: iceberg` == the connector we
# defined in infra/trino/etc/catalog/iceberg.properties.
crypto_gold:
  target: dev
  outputs:
    dev:
      type: trino
      host: trino
      port: 8080
      user: dbt
      http_scheme: http
      catalog: iceberg
      schema: gold          # default target namespace for models
      threads: 1            # single-writer catalog; keep commits serial
