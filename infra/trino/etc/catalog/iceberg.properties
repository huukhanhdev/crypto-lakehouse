# Trino Iceberg connector, pointed at the SAME REST catalog + MinIO that Phase 1
# (Spark) writes to — so Gold reads the exact Silver tables already in the lake.
# We reuse tabulario/iceberg-rest instead of the spec's Nessie (see DECISIONS D2.1).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/

# Native S3 filesystem talking to MinIO (path-style, static creds).
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin
